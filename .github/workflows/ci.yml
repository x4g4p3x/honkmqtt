name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Goose (ubuntu-24.04)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Goose v2026.4
        shell: pwsh
        run: |
          $asset = 'goose-v2026.4-linux-x64.tar.gz'
          $expected = '559ad7572df89fcd1273512d8679528bcdf876c252ec1f31608d3808b24125b3'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP 'goose'
          Invoke-WebRequest -Uri "https://github.com/aardappel/goose/releases/download/v2026.4/$asset" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'Goose archive hash mismatch' }
          New-Item -ItemType Directory -Path $destination | Out-Null
          tar -xzf $archive -C $destination
          if ($LASTEXITCODE -ne 0) { throw 'Goose extraction failed' }
          $executable = Get-ChildItem $destination -File -Recurse | Where-Object { $_.Name -eq 'goose' } | Select-Object -First 1
          if (-not $executable) { throw 'Goose executable not found in archive' }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check Goose formatting and diagnostics
        run: python scripts/lint.py
      - name: Run test-entry self-tests
        run: python scripts/test_selftest.py
      - name: Check TCP example resource limits
        run: python examples/tcp/test_resources.py
      - name: Check TCP example QoS exchanges
        run: python examples/tcp/test_qos_interop.py
      - name: Run interpreter tests
        run: python scripts/test.py
      - name: Install gcc for native builds
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gcc
      - name: Run native builds and tests
        run: python scripts/test.py --native --require-native

  windows:
    name: Goose (windows-2022)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install Goose v2026.4
        shell: pwsh
        run: |
          $asset = 'goose-v2026.4-windows-x64.zip'
          $expected = '87ceb0ff2394e0ac4154b6c6b865c084cadbf236558cc956b114f37d6e619cdb'
          $archive = Join-Path $env:RUNNER_TEMP $asset
          $destination = Join-Path $env:RUNNER_TEMP 'goose'
          Invoke-WebRequest -Uri "https://github.com/aardappel/goose/releases/download/v2026.4/$asset" -OutFile $archive
          if ((Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant() -ne $expected) { throw 'Goose archive hash mismatch' }
          New-Item -ItemType Directory -Path $destination | Out-Null
          Expand-Archive -Path $archive -DestinationPath $destination
          $executable = Get-ChildItem $destination -File -Recurse | Where-Object { $_.Name -eq 'goose.exe' } | Select-Object -First 1
          if (-not $executable) { throw 'Goose executable not found in archive' }
          $executable.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
      - name: Check Goose formatting and diagnostics
        run: python scripts/lint.py
      - name: Run test-entry self-tests
        run: python scripts/test_selftest.py
      - name: Run interpreter tests
        run: python scripts/test.py
      - name: Enable MSVC for native builds
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Run native builds and tests
        env:
          GOOSE_CC: msvc
        run: python scripts/test.py --native --require-native
